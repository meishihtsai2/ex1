<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python 程式自評系統</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Skulpt: 瀏覽器端純 JS 的 Python 直譯器 -->
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>
  <style>
    body { background-color: #f8f9fa; }
    .code-editor {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      tab-size: 4;
      background-color: #282c34;
      color: #abb2bf;
    }
  </style>
</head>
<body class="py-4">
<div class="container" style="max-width: 800px;">
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">📝 Python 練習題：打招呼程式 (input 與 print)</h4>
    </div>
    <div class="card-body">
      <h5>題目說明：</h5>
      <p>請寫出一段 Python 程式，使用 <code>input()</code> 讀取使用者的名字，並使用 <code>print()</code> 輸出包含問候的字串：<code>你好，{姓名}！</code></p>
      
      <div class="alert alert-secondary">
        <strong>範例輸出：</strong><br>
        輸入：<code>小明</code> &rarr; 輸出：<code>你好，小明！</code><br>
        輸入：<code>Alice</code> &rarr; 輸出：<code>你好，Alice！</code>
      </div>

      <!-- 基本資料 -->
      <div class="row g-2 mb-3">
        <div class="col-md-6">
          <label class="form-label">學號 / 帳號：</label>
          <input type="text" id="studentId" class="form-control" placeholder="例如: S101">
        </div>
        <div class="col-md-6">
          <label class="form-label">姓名：</label>
          <input type="text" id="studentName" class="form-control" placeholder="例如: 王小明">
        </div>
      </div>

      <!-- 程式碼輸入 -->
      <div class="mb-3">
        <label class="form-label">Python 程式碼：</label>
        <textarea id="pythonCode" class="form-control code-editor" rows="7" placeholder="# 在此輸入 Python 程式碼
name = input()
print(f'你好，{name}！')"></textarea>
      </div>

      <!-- 操作按鈕 -->
      <div class="d-flex gap-2 mb-3">
        <button id="evalBtn" class="btn btn-success" onclick="startEvaluation()">🚀 執行自評</button>
        <button id="submitBtn" class="btn btn-primary" onclick="submitResult()" disabled>📤 提交成績到系統</button>
      </div>

      <!-- 評測結果展示 -->
      <div id="resultBox" class="mt-3"></div>
    </div>
  </div>
</div>

<script>
// 定義測試案例 (模擬 input 與比對 expected output)
const testCases = [
  { input: "小明", expected: "你好，小明！" },
  { input: "Alice", expected: "你好，Alice！" }
];

let lastEvaluation = null;

// 單一測資的執行函式
function runSingleTest(code, inputVal) {
  return new Promise((resolve) => {
    let output = "";
    
    // 設定 Skulpt 執行環境
    Sk.configure({
      output: function(text) {
        output += text;
      },
      read: function(x) {
        if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
          throw "找不到模組: '" + x + "'";
        }
        return Sk.builtinFiles["files"][x];
      },
      // 攔截 input()，自動餵入測資
      inputfun: function() {
        return inputVal;
      },
      inputfunTakesPrompt: false
    });

    // 非同步執行 Python
    Sk.misceval.asyncToPromise(function() {
      return Sk.importMainWithBody("<stdin>", false, code, true);
    }).then(function() {
      // 成功跑完：去除結尾空白與換行後回傳
      resolve({ success: true, output: output.trim() });
    }, function(err) {
      // 語法錯誤或執行期錯誤
      resolve({ success: false, error: err.toString() });
    });
  });
}

// 點擊「執行自評」
async function startEvaluation() {
  const code = document.getElementById("pythonCode").value;
  if (!code.trim()) {
    alert("請先輸入 Python 程式碼！");
    return;
  }

  const evalBtn = document.getElementById("evalBtn");
  const resultBox = document.getElementById("resultBox");
  evalBtn.disabled = true;
  resultBox.innerHTML = '<div class="spinner-border text-primary" role="status"></div> 評測中...';

  let passCount = 0;
  let html = '<h5>評測結果：</h5><ul class="list-group">';

  for (let i = 0; i < testCases.length; i++) {
    const tc = testCases[i];
    const res = await runSingleTest(code, tc.input);

    if (res.success && res.output === tc.expected) {
      passCount++;
      html += `<li class="list-group-item list-group-item-success">
        ✅ <strong>測資 ${i + 1} 通過</strong> (輸入: <code>${tc.input}</code>, 輸出: <code>${res.output}</code>)
      </li>`;
    } else {
      const actual = res.success ? `<code>${res.output}</code>` : `<span class="text-danger">${res.error}</span>`;
      html += `<li class="list-group-item list-group-item-danger">
        ❌ <strong>測資 ${i + 1} 失敗</strong><br>
        輸入: <code>${tc.input}</code><br>
        預期: <code>${tc.expected}</code><br>
        實際: ${actual}
      </li>`;
    }
  }

  const score = Math.round((passCount / testCases.length) * 100);
  html += `</ul><div class="alert ${score === 100 ? 'alert-success' : 'alert-warning'} mt-3">
    <strong>得分：${score} 分</strong> (${passCount}/${testCases.length} 通過)
  </div>`;

  resultBox.innerHTML = html;
  evalBtn.disabled = false;

  // 暫存本次自評結果並開放提交按鈕
  lastEvaluation = {
    score: score,
    status: score === 100 ? "全部通過 (AC)" : `未完全通過 (${passCount}/${testCases.length})`,
    code: code
  };
  document.getElementById("submitBtn").disabled = false;
}

// 點擊「提交成績到系統」
function submitResult() {
  const studentId = document.getElementById("studentId").value.trim();
  const studentName = document.getElementById("studentName").value.trim();

  if (!studentId || !studentName) {
    alert("請填寫學號與姓名後再提交！");
    return;
  }

  const submitBtn = document.getElementById("submitBtn");
  submitBtn.disabled = true;
  submitBtn.innerText = "提交中...";

  const payload = {
    studentId: studentId,
    studentName: studentName,
    score: lastEvaluation.score,
    status: lastEvaluation.status,
    code: lastEvaluation.code
  };

  // 呼叫 GAS 後端儲存
  google.script.run
    .withSuccessHandler(function(res) {
      alert(res.message);
      submitBtn.innerText = "已提交完成";
    })
    .withFailureHandler(function(err) {
      alert("提交發生錯誤：" + err);
      submitBtn.disabled = false;
      submitBtn.innerText = "重新提交";
    })
    .recordSubmission(payload);
}
</script>
</body>
</html>
